# Nexus Finance: MySQL, el core bancario (Java) y el motor de riesgo (Python) en una red privada.
# Los dos servicios se clonan dentro de esta carpeta, o donde digan BACKEND_DIR y RISK_ENGINE_DIR
# (ver README). Todo secreto sale de .env.

services:
  # 1. Base de Datos (MySQL)
  nexus-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: nexusdb
      # El backend entra con su propio usuario, nunca como root
      MYSQL_USER: nexus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306" # 3307 en tu PC para no chocar con un MySQL local
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nexus-network
    healthcheck:
      # Por TCP: el servidor temporal que inicializa la base solo escucha por socket
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 2. Risk Engine (Microservicio Python)
  nexus-risk-engine:
    build: ${RISK_ENGINE_DIR:-./nexus-risk-engine}
    ports:
      - "127.0.0.1:${RISK_ENGINE_PORT:-8000}:8000"
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 3. Backend Core (Spring Boot)
  nexus-backend:
    build: ${BACKEND_DIR:-./nexus-backend-core}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      nexus-db:
        condition: service_healthy
      nexus-risk-engine:
        condition: service_healthy
    environment:
      # 'nexus-db' y 'nexus-risk-engine' son los nombres de los servicios en esta red
      SPRING_DATASOURCE_URL: jdbc:mysql://nexus-db:3306/nexusdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: nexus
      DB_PASSWORD: ${MYSQL_PASSWORD}
      RISK_ENGINE_URL: http://nexus-risk-engine:8000/api/v1
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (32 caracteres o más)}
      NEXUS_ADMIN_USERNAME: ${NEXUS_ADMIN_USERNAME:-}
      NEXUS_ADMIN_PASSWORD: ${NEXUS_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:

networks:
  nexus-network:
    driver: bridge
